// Morass Roleplay — server configuration
// Loaded automatically by srcds on startup.

hostname "Morass Roleplay"
sv_password ""
rcon_password "change-me"

sv_lan 0
sv_region 255

// Networking
sv_maxrate 0
sv_minrate 100000
sv_maxupdaterate 66
sv_minupdaterate 33

// Logging
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
sv_log_onefile 0

// Misc
sv_allowupload 1
sv_allowdownload 1
sv_voiceenable 1
sv_alltalk 0

// Helix / roleplay defaults
sbox_noclip 0
sbox_godmode 0
sbox_playershurtplayers 1
